name: Integração Contínua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificar-api:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest httpx

    - name: Rodar Testes
      run: |
        pytest

    - name: Subir a API e testar requisição (Integração)
      run: |
        # Usando uvicorn direto para não depender do CLI padrão
        uvicorn main:app --port 8000 &

        # Dá 3 segundos para o servidor ligar completamente
        sleep 3

        # O '-f' faz o CI falhar se a API retornar erro (ex: 404 ou 500)
        curl -f http://localhost:8000/
        curl -f http://localhost:8000/somar/10/20